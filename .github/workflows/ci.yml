name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  live-databases:
    # Parsed migrations must match what real PostgreSQL and MySQL report.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      DR_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      DR_TEST_MYSQL_URL: mysql+pymysql://root:root@127.0.0.1:3306/mysql
      DR_REQUIRE_LIVE_DB: "1"   # fail rather than skip if a service is down
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,postgres,mysql]"
      - run: python -m pytest -m "postgres or mysql" -v

  action:
    # Dogfood the GitHub Action from this checkout on the example project.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        id: docs
        with:
          mode: check
          working-directory: examples/quickstart

  mermaid:
    # Every diagram we commit must render with the official Mermaid CLI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -e .
      - name: Extract diagrams from generated docs
        run: python scripts/extract_mermaid.py mermaid-out examples
      - name: Render each diagram
        run: |
          echo '{"args": ["--no-sandbox"]}' > puppeteer.json
          for file in mermaid-out/*.mmd; do
            echo "rendering $file"
            npx -y @mermaid-js/mermaid-cli@11 -p puppeteer.json -q -i "$file" -o "${file%.mmd}.svg"
          done
