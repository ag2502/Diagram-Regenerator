[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "diagram-regenerator"
dynamic = ["version"]
description = "Always-current database schema diagrams, PR schema diffs and cross-environment drift alerts."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Amogh Gaikwad" }]
keywords = ["database", "schema", "erd", "er-diagram", "mermaid", "migrations", "drift", "sqlalchemy", "github-action"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "sqlalchemy>=2.0",
    "sqlglot>=27",
    "pyyaml>=6",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["pymysql>=1.1"]
llm = ["anthropic>=1.11"]
dev = ["pytest>=8", "ruff>=0.5", "anthropic>=1.11"]

[project.scripts]
diagram-regen = "diagram_regenerator.cli:main"

[project.urls]
Homepage = "https://github.com/ag2502/Diagram-Regenerator"
Issues = "https://github.com/ag2502/Diagram-Regenerator/issues"

[tool.hatch.version]
path = "src/diagram_regenerator/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/diagram_regenerator"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "action.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "postgres: needs a live PostgreSQL server (DR_TEST_POSTGRES_URL)",
    "mysql: needs a live MySQL server (DR_TEST_MYSQL_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
